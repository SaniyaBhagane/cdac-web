<h1>PPF Calculator</h1>

<input id ='x1' type="text" placeholder="Amount"/>
<br/>

<input id ='x2' type="text" placeholder="RoI"/>
<br/>

<input id ='x3' type="number" min="1" max="30" placeholder="Duration"/>
<br/>

<button id="btn">Calculate</button>
<table border="1" width="700">
    <thead>
        <tr>
            <th>Year</th>
            <th>Opening Balance</th>
            <th>Amount</th>
            <th>Interest</th>
            <th>Closing Balance</th>
            
        </tr>
    </thead>
    <tbody id="result"></tbody>
</table>
<p id="message">Enter values to calculate PPF...</p> 

<script src="ppf.js"></script>
