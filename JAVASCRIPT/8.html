<script>
    //ARRAY
    let brands=['nike','adidas','puma'];
    console.log(brands);
    console.log(brands[0]);
    console.log(brands[1]);
    console.log(brands.length);

    brands.push('dell','hp');
    brands.unshift('lenovo','zara');
    console.log(brands);

    console.log(brands.includes('lenovo'));
    console.log(brands.indexOf('lenovo'));
    brands.pop();
    console.log(brands);
    brands.shift();
    console.log(brands);


</script>
